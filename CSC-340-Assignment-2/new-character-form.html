<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Character</title>
</head>
<body>
    <h1>Add a New Character</h1>

    <p>
        Want to add another character to the gallery? Fill out the form below.
    </p>

    <form>

        <label for="name">Character Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="universe">Universe:</label>
        <input type="text" id="universe" name="universe">

        <br><br>

        <label for="role">Role:</label>
        <input type="text" id="role" name="role">

        <br><br>

        <label for="image">Image URL:</label>
        <input type="url" id="image" name="image">

        <br><br>

        <label for="description">Short Description:</label>
        <br>
        <textarea id="description" name="description" rows="5" cols="40"></textarea>

        <br><br>

        <button type="submit">Add Character</button>

    </form>

    
</body>
</html>
